# デモ用のプレースホルダー。実際の値に置き換えてから apply すること。
# 本番運用では External Secrets / AWS Secrets Manager 等を使い、このファイルはコミットしない。
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-secret
  namespace: keycloak
type: Opaque
stringData:
  KC_DB_USERNAME: CHANGE_ME
  KC_DB_PASSWORD: CHANGE_ME
  KC_BOOTSTRAP_ADMIN_USERNAME: CHANGE_ME
  KC_BOOTSTRAP_ADMIN_PASSWORD: CHANGE_ME
